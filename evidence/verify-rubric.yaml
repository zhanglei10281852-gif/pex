rubrics:
  - id: 1
    type: f2p
    text: "并发启动同一文档服务时只有一个调用创建并发布后台进程，其他调用等待后复用同一可访问 URL。"
  - id: 2
    type: f2p
    text: "损坏或陈旧的 pidfile、已退出进程和被无关程序复用的 PID 不会被报告为文档服务器，也不会被 --kill-server 误杀。"
  - id: 3
    type: f2p
    text: "关闭只终止再次确认属于同一代的服务器，等待其退出并清理对应状态；启动与关闭交错不会影响后来发布的新代。"
  - id: 4
    type: f2p
    text: "子进程未就绪、启动超时或状态写入失败时不会留下运行中假记录，日志被保留且后续启动可以重新尝试。"
  - id: 5
    type: f2p
    text: "--server-info 只返回经过进程身份和服务可达性验证的当前实例，浏览器只在实例完成提交后打开。"
  - id: 6
    type: p2p
    text: "标准端口失败后的临时端口回退、--no-open、无实例时的关闭结果以及缺少内嵌文档时的远程提示保持既有行为。"
