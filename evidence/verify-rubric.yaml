rubrics:
  - id: 1
    type: f2p
    text: "多目标调用只有在全部 scie 和请求的校验 sidecar 完成后才发布，成功结果包含完整且互相匹配的目标集合。"
  - id: 2
    type: f2p
    text: "后续目标的获取或构建失败时，本次调用不会留下前序目标的新文件，并保留调用前已有的完整产物集。"
  - id: 3
    type: f2p
    text: "校验文件生成或最终替换失败时，二进制与 sidecar 不会形成孤立或新旧混合组合，错误能指出失败目标和阶段。"
  - id: 4
    type: f2p
    text: "--scie-only 只在整组发布成功后删除源 PEX；任一失败都会保留用户源文件，并只清理本次命令拥有的临时副本。"
  - id: 5
    type: f2p
    text: "并发发布同名平台集合不会交叉混入文件或互删输入，每次可见切换都对应一套完整代次。"
  - id: 6
    type: p2p
    text: "单平台、不同命名风格、eager 与 lazy、覆盖旧文件以及未启用 --scie-only 的成功行为保持兼容。"
