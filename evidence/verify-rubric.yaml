rubrics:
  - id: 1
    type: f2p
    text: "创建或更新同步成功时，lock 与 venv 只对外呈现同一代解析结果，环境中的分发集合与最终 lock 一致。"
  - id: 2
    type: f2p
    text: "依赖解析、分发安装或移除失败时，原有 lock 和原有 venv 均保持可用；首次同步失败不会留下可被后续调用当作成功结果的文件或环境。"
  - id: 3
    type: f2p
    text: "最终替换失败或进程在发布途中中断后，重试能够清理或接管候选状态并收敛到一套结果，不需要用户手工修复混合状态。"
  - id: 4
    type: f2p
    text: "针对同一 lock 与 venv 的并发同步不会分别覆盖两项资源，等待或竞争调用完成后只能观察已提交代次或安全重新计算。"
  - id: 5
    type: p2p
    text: "不指定 venv 的 lock-only 同步和 dry-run 保持既有输出及非变更行为。"
  - id: 6
    type: p2p
    text: "同步成功后 -- 后命令仍在已提交环境中执行，命令自身非零退出不会回滚已经成功同步的 lock 与 venv。"
